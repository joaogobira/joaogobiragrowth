<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gerador de Ícones</title>
</head>
<body>
  <h1>Gerando ícones...</h1>
  <div id="results"></div>

  <script>
    function generateIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Fundo: Gradiente linear de azul para roxo
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#4f8ef7');
      gradient.addColorStop(1, '#b37af5');
      ctx.fillStyle = gradient;
      
      // Cantos arredondados
      const radius = size * 0.22;
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fill();

      // Desenhar o símbolo: Círculo branco com um robô/letra no centro
      ctx.fillStyle = '#ffffff';
      
      // Ajustar fonte dependendo do tamanho
      ctx.font = `bold ${Math.round(size * 0.5)}px 'Inter', -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      // Desenhar "JG"
      ctx.fillText('JG', size / 2, size / 2 + (size * 0.03));

      return canvas.toDataURL('image/png');
    }

    const sizes = [16, 48, 128];
    const data = {};
    sizes.forEach(size => {
      data[size] = generateIcon(size);
      
      // Mostrar na tela
      const img = document.createElement('img');
      img.src = data[size];
      img.style.margin = '10px';
      img.style.border = '1px solid #ccc';
      document.body.appendChild(img);
      
      const p = document.createElement('p');
      p.textContent = `Size ${size}x${size}`;
      document.body.appendChild(p);
    });

    // Colocar no DOM para ler com o browser agent
    const textarea = document.createElement('textarea');
    textarea.id = 'base64-data';
    textarea.value = JSON.stringify(data);
    textarea.style.width = '100%';
    textarea.style.height = '200px';
    document.body.appendChild(textarea);
  </script>
</body>
</html>
